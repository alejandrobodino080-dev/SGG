<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - SGG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <h1>SGG</h1>
    </div>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema día/noche" aria-pressed="false">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">Modo Noche</span>
    </button>
  </header>

  <main>
    <section class="auth-card">
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Ingresa tus credenciales para acceder al sistema SGG</p>

      <div id="alert-message" class="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Usuario o Correo Electrónico</label>
          <input type="text" id="username" name="username" placeholder="Ej. admin o admin@sgg.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
            <button type="button" id="toggle-password" class="toggle-password-btn" title="Mostrar/Ocultar contraseña" aria-label="Mostrar contraseña">👁️</button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn-primary">Ingresar</button>
      </form>

      <div class="auth-links">
        <a href="registro.html">¿No tienes cuenta? Regístrate aquí (RF-03)</a>
        <a href="recuperar.html">¿Olvidaste tu contraseña? (RF-04)</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sistema de Gestión de Gastos (SGG) - Módulo de Autenticación Completo (IEEE 830 / IEEE 829)</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
