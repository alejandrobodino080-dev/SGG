<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto SGG - Autenticación y Registro de Usuarios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <h1>Proyecto SGG</h1>
      <!-- Switch de Tema Día/Noche -->
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Alternar modo oscuro y claro" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">☀️</span>
        <span id="theme-text">Modo Oscuro</span>
      </button>
    </div>
  </header>

  <main class="main-container">
    <!-- Contenedor de Formularios -->
    <div class="auth-card">
      <!-- Navegación entre pestañas de Login y Registro -->
      <div class="tab-nav" role="tablist" aria-label="Formularios de Autenticación">
        <button id="tab-login" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="panel-login">Iniciar Sesión</button>
        <button id="tab-register" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="panel-register">Registrarse</button>
      </div>

      <!-- Panel de Inicio de Sesión -->
      <section id="panel-login" class="tab-panel active" role="tabpanel" aria-labelledby="tab-login">
        <h2>Iniciar Sesión</h2>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-username">Usuario:</label>
            <input type="text" id="login-username" name="username" required autocomplete="username" placeholder="Ingresa tu usuario">
          </div>

          <div class="form-group">
            <label for="login-password">Contraseña:</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña">
          </div>

          <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
        <div id="login-message" class="message-banner" aria-live="polite"></div>
      </section>

      <!-- Panel de Registro de Usuarios -->
      <section id="panel-register" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-register">
        <h2>Registro de Nuevo Usuario</h2>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-username">Nuevo Usuario:</label>
            <input type="text" id="reg-username" name="username" required autocomplete="username" placeholder="Nombre de usuario">
          </div>

          <div class="form-group">
            <label for="reg-password">Contraseña:</label>
            <input type="password" id="reg-password" name="password" required autocomplete="new-password" placeholder="Contraseña segura">
          </div>

          <button type="submit" class="btn btn-secondary">Crear Cuenta</button>
        </form>
        <div id="register-message" class="message-banner" aria-live="polite"></div>
      </section>

      <!-- Información de Usuarios de Prueba (Ayuda) -->
      <footer class="demo-credentials">
        <p><strong>Usuarios predeterminados de prueba:</strong></p>
        <ul>
          <li><code>admin</code> / <code>admin123</code></li>
          <li><code>usuario1</code> / <code>clave456</code></li>
        </ul>
      </footer>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
